global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client 20000ms
    timeout server 20000ms

frontend http-in
    bind *:80
    default_backend servers

backend servers
    server strapi rechkin-strapi:1337 check
    server astro rechkin-astro:3000 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 15s
