version: "3.9"

services:
  haproxy:
    image: haproxy:2.6
    container_name: rechkin-haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    ports:
      - "80:80"
      - "8404:8404"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8404"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontoffice:
    build:
      context: ./frontoffice
      dockerfile: Dockerfile
    container_name: rechkin-astro
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backoffice

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    container_name: rechkin-strapi
    restart: unless-stopped
    env_file: .env
    ports:
      - "1337:1337"
    depends_on:
      - db

  db:
    image: postgres:14.2-alpine
    container_name: rechkin-postgres
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
